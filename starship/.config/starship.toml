# -----------------------------------------------------
# File: starship-dark.toml
# Description: Starship prompt configuration (Gruvbox Dark)
# Author: AMOS-fet
# -----------------------------------------------------

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'gruvbox_dark'

# -----------------------------------------------------
# 1. PROMPT FORMAT (Powerline Style)
# -----------------------------------------------------
# Logic for Light Theme:
# Bars are saturated/dark -> Text must be LIGHT.
# End modules are beige (light) -> Text must be DARK.

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](bg:color_aqua fg:color_yellow)\
$git_branch\
$git_status\
[](bg:color_blue fg:color_aqua)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](bg:color_bg1 fg:color_blue)\
$docker_context\
$conda\
$pixi\
[](bg:color_bg3 fg:color_bg1)\
$fill\
$time\
[ ](fg:color_bg3)\
$line_break$character"""

# -----------------------------------------------------
# 2. PALETTE DEFINITION (Gruvbox Dark)
# -----------------------------------------------------
[palettes.gruvbox_dark]

color_base_text = '#F9EDD2' 
color_fg0       = '#282828'

color_ui_text   = '#504945'

color_bg1    = '#8F8173'    # Dark Beige
color_bg3    = '#A89985'    # Darker Beige
color_blue   = '#83A497'    # Dark Blue
color_aqua   = '#8EBE7A'    # Dark Aqua
color_green  = '#B7B827'    # Olive Green
color_orange = '#FE7C0D'    # Rust
color_purple = '#D184CC'    # Purple
color_red    = '#F94835'    # Blood Red
color_yellow = '#F9BB31'    # Ochre

# -----------------------------------------------------
# 3. CORE MODULES (OS, User, Dir)
# -----------------------------------------------------

[os]
style = "bg:color_orange fg:color_base_text"
disabled = false
format = '[$symbol]($style)'

[os.symbols]
Windows     = "󰍲"
Ubuntu      = "󰕈"
SUSE        = ""
Raspbian    = "󰐿"
Mint        = "󰣭"
Macos       = "󰀵"
Manjaro     = ""
Linux       = "󰌽"
Gentoo      = "󰣨"
Fedora      = "󰣛"
Alpine      = ""
Amazon      = ""
Android     = ""
AOSC        = ""
Arch        = "󰣇"
Artix       = "󰣇"
EndeavourOS = " "
CentOS      = ""
Debian      = "󰣚"
Redhat      = "󱄛"
RedHatEnterprise = "󱄛"
Pop         = ""
Unknown     = "󰌽"

CachyOS = "󰌽"
[username]
show_always = true
style_user = "bg:color_orange fg:color_base_text bold"
style_root = "bg:color_orange fg:color_base_text bold"
format = '[ $user ]($style)'

[directory]
style = "bg:color_yellow fg:color_base_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "
"Videos"    = " "
# -----------------------------------------------------
# 4. VERSION CONTROL (Git)
# -----------------------------------------------------

[git_branch]
symbol = ""
style = "bg:color_aqua fg:color_base_text"
format = '[[ $symbol $branch ](bg:color_aqua fg:color_base_text)]($style)'

[git_status]
style = "bg:color_aqua fg:color_base_text"
format = '[[($all_status$ahead_behind )](bg:color_aqua fg:color_base_text)]($style)'

# -----------------------------------------------------
# 5. LANGUAGES & RUNTIMES (Blue Background, Light Text)
# -----------------------------------------------------

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[nodejs]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

# -----------------------------------------------------
# 6. TOOLS (Beige Background, Dark Text)
# -----------------------------------------------------

[docker_context]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_ui_text bg:color_bg3)]($style)'

[conda]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_ui_text bg:color_bg3)]($style)'

[pixi]
symbol = "P "
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_ui_text bg:color_bg3)]($style)'

# -----------------------------------------------------
# 7. RIGHT SIDE & PROMPT LINE
# -----------------------------------------------------

[fill]
symbol = " "
style = "bg:color_bg3"

[time]
disabled = false
time_format = "%T"
style = "bg:color_bg3"
format = '[[  $time ](fg:color_ui_text bg:color_bg3)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol   = '[](bold fg:color_red)'
vimcmd_symbol  = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol     = '[](bold fg:color_purple)'
vimcmd_visual_symbol      = '[](bold fg:color_yellow)'
