# -----------------------------------------------------
# File: hyprland.conf
# Description: Main configuration file for Hyprland WM
# Author: AMOS-fet
# -----------------------------------------------------

# -----------------------------------------------------
# 1. CONFIGURATION SOURCE
# -----------------------------------------------------

# Source external colors (Managed by theme-switch.sh)
source = ~/.config/hypr/colors.conf

# -----------------------------------------------------
# 2. MONITORS
# -----------------------------------------------------

source = ~/.config/hypr/monitors.conf
monitor = , preferred, auto-right, 1

# -----------------------------------------------------
# 3. PROGRAMS & VARIABLES
# -----------------------------------------------------

$terminal    = kitty
$fileManager = nemo
$menu        = rofi -show drun -config ~/.config/rofi/config.rasi
$browser     = librewolf
$scripts     = ~/dotfiles/scripts

# -----------------------------------------------------
# 4. AUTOSTART
# -----------------------------------------------------

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = mako
exec-once = waybar
exec-once = awww-daemon

# Initial cursor setup
exec-once = hyprctl setcursor phinger-cursors-light 24

# -----------------------------------------------------
# 5. ENVIRONMENT VARIABLES
# -----------------------------------------------------

env = BROWSER,librewolf
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,phinger-cursors-light
env = XCURSOR_SIZE,24
env = GTK_ICON_THEME,WhiteSur-dark

# -----------------------------------------------------
# 6. LOOK AND FEEL
# -----------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 4

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,    0.23, 1,    0.32, 1
    bezier = easeInOutCubic,  0.65, 0.05, 0.36, 1
    bezier = linear,          0,    0,    1,    1
    bezier = almostLinear,    0.5,  0.5,  0.75, 1
    bezier = quick,           0.15, 0,    0.1,  1

    animation = global,         1, 10,   default
    animation = border,         1, 5.39, easeOutQuint
    animation = windows,        1, 4.79, easeOutQuint
    animation = windowsIn,      1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,     1, 1.49, linear,       popin 87%
    animation = fadeIn,         1, 1.73, almostLinear
    animation = fadeOut,        1, 1.46, almostLinear
    animation = fade,           1, 3.03, quick
    animation = layers,         1, 3.81, easeOutQuint
    animation = layersIn,       1, 4,    easeOutQuint, fade
    animation = layersOut,      1, 1.5,  linear,       fade
    animation = fadeLayersIn,   1, 1.79, almostLinear
    animation = fadeLayersOut,  1, 1.39, almostLinear
    animation = workspaces,     1, 1.94, almostLinear, fade
    animation = workspacesIn,   1, 1.21, almostLinear, fade
    animation = workspacesOut,  1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

xwayland {
    force_zero_scaling = true
}

# -----------------------------------------------------
# 7. INPUT CONFIGURATION
# -----------------------------------------------------

input {
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        clickfinger_behavior = false
        tap-to-click = true
        scroll_factor = 1.0
    }
}

gestures {
    gesture = 3, horizontal, workspace, auto
}

# Per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# -----------------------------------------------------
# 8. KEYBINDINGS
# -----------------------------------------------------

$mainMod = SUPER

# --- Applications ---
bind = $mainMod, return, exec, $terminal
bind = $mainMod, space, exec, $menu
bind = $mainMod, F, exec, kitty -e yazi
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod, E, exec, $browser
bind = $mainMod, D, exec, makoctl dismiss -a

# --- Window Management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, W, fullscreen
bind = $mainMod SHIFT, W, togglefloating

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Move Windows ---
bind = $mainMod CTRL SHIFT, left,  movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up,    movewindow, u
bind = $mainMod CTRL SHIFT, down,  movewindow, d

# --- Resize Windows ---
binde = $mainMod CTRL, up,   resizeactive, -20 0
binde = $mainMod CTRL, down, resizeactive, 20 0

# --- Workspaces (Custom Scripts) ---
# Updated to use the new $scripts variable
bind = $mainMod CTRL, right, exec, $scripts/cycle-workspace.sh next
bind = $mainMod CTRL, left,  exec, $scripts/cycle-workspace.sh prev
bind = CTRL ALT, right, exec, $scripts/cycle-workspace.sh move-next
bind = CTRL ALT, left,  exec, $scripts/cycle-workspace.sh move-prev

# --- Special Workspace ---
bind = $mainMod, S,       togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# --- Audio & Media ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# --- Guide ---
bind = $mainMod, H, exec, ~/dotfiles/scripts/show-guide.sh

# -----------------------------------------------------
# 9. WINDOW & LAYER RULES
# -----------------------------------------------------

# General Rules
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = *
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Waybar
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = waybar
}

windowrule {
  name = windowrule-3
  border_size = 0
  no_shadow = on
  no_blur = on
  match:class = ^(waybar)$
  match:float = 1
}


# Wofi
layerrule {
  name = layerrule-2
  blur = on
  no_anim = on
  ignore_alpha = 0
  match:namespace = wofi
}

windowrule {
  name = windowrule-4
  no_shadow = on
  border_size = 0
  float = on
  move = (center)
  opacity = 1.0 override 1.0 override
  match:class = ^(wofi)$
}


# Apps
windowrule {
  name = windowrule-5
  tile = on
  match:class = ^(Pixelorama)$
}


# Wiki
windowrule {
  name = windowrule-6
  float = on
  center = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  animation = popin
  match:class = ^(floating_guide)$
}

