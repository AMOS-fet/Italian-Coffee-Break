# -----------------------------------------------------
# GRUVBOX DARK THEME DEFINITIONS
# Source: https://github.com/morhetz/gruvbox
# -----------------------------------------------------

# --- BACKGROUND & FOREGROUND ---
$bg             = rgb(282828)
$bg_bright      = rgb(3c3836)
$fg             = rgb(ebdbb2)
$fg_dim         = rgb(a89984)

# --- NORMAL COLORS (Darker/Standard) ---
$red            = rgb(cc241d)
$green          = rgb(98971a)
$yellow         = rgb(d79921)
$blue           = rgb(458588)
$purple         = rgb(b16286)
$aqua           = rgb(689d6a)
$orange         = rgb(d65d0e)

# --- BRIGHT COLORS (Lighter/Vibrant) ---
$red_b          = rgb(fb4934)
$green_b        = rgb(b8bb26)
$yellow_b       = rgb(fabd2f)
$blue_b         = rgb(83a598)
$purple_b       = rgb(d3869b)
$aqua_b         = rgb(8ec07c)
$orange_b       = rgb(fe8019)

# --- HYPRLAND BORDER CONFIGURATION ---
# Active: Gradient from Bright Orange to Standard Yellow (45 degrees)
# Inactive: Dark Gray (Background Bright)
$active_border      = $orange_b $yellow 45deg
$inactive_border    = $bg_bright
