# -----------------------------------------------------
# File: kitty.conf
# Description: Main configuration for Kitty Terminal
# Author: AMOS-fet
# -----------------------------------------------------

# -----------------------------------------------------
# 1. THEME & APPEARANCE
# -----------------------------------------------------

# Import the theme (Managed by theme-switch.sh)
include theme.conf

# Fonts
font_family      SF Mono Liga
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        11.0
modify_font      cell_height 110%

# Nerd Fonts Symbol Map
# Forces specific unicode ranges to use JetBrainsMono Nerd Font.
# Useful to ensure icons look correct regardless of the main font.
symbol_map U+23FB-U+23FE,U+2B58,U+E200-U+E2A9,U+E0A0-U+E0A3,U+E0B0-U+E0BF,U+E0C0-U+E0C8,U+E0CC-U+E0CF,U+E0D0-U+E0D2,U+E0D4,U+E700-U+E7C5,U+F000-U+F2E0,U+2665,U+26A1,U+F400-U+F4A8,U+F67C,U+E000-U+E00A,U+F300-U+F313,U+E5FA-U+E62B JetBrainsMono Nerd Font

# -----------------------------------------------------
# 2. CURSOR
# -----------------------------------------------------

cursor_shape          beam
cursor_beam_thickness 1.5
cursor_text_color     background

# Disable shell integration for cursor to maintain the beam shape
shell_integration     no-cursor

# -----------------------------------------------------
# 3. WINDOW LAYOUT
# -----------------------------------------------------

window_padding_width    10
background_opacity      1.0

# Disable confirmation when closing window
confirm_os_window_close 0

# -----------------------------------------------------
# 4. SYSTEM
# -----------------------------------------------------

enable_audio_bell no

# -----------------------------------------------------
# 5. KEYBINDINGS
# -----------------------------------------------------

# Clipboard Operations
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Custom Shell Integration Hacks
# Sends escape codes for Zsh bindkeys (Cut, Select All)
map ctrl+shift+x send_text all \x1b[Sx
map ctrl+shift+a send_text all \x1b[Sa

# Navigation Fixes
# Unbind these in Kitty to allow Zsh/Editors to handle word jumping
map ctrl+shift+left  no_op
map ctrl+shift+right no_op
map ctrl+shift+home  no_op
map ctrl+shift+end   no_op
